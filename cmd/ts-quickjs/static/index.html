<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS QuickJS Runner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/material-darker.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1e1e2e; color: #cdd6f4; height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; }
.sidebar { width: 260px; min-width: 260px; background: #181825; border-right: 1px solid #313244; display: flex; flex-direction: column; }
.sidebar-header { padding: 16px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
.sidebar-header h2 { font-size: 15px; font-weight: 600; }
#new-btn { background: #cba6f7; color: #1e1e2e; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
#new-btn:hover { background: #b4befe; }
#script-list { list-style: none; overflow-y: auto; flex: 1; }
#script-list li { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
#script-list li:hover { background: #313244; }
#script-list li.active { background: #45475a; border-left: 3px solid #cba6f7; }
.snippet-info { overflow: hidden; }
.snippet-label-display { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snippet-name-display { font-size: 11px; color: #a6adc8; margin-top: 2px; }
.delete-btn { background: none; border: none; color: #f38ba8; cursor: pointer; font-size: 18px; padding: 2px 6px; line-height: 1; border-radius: 4px; }
.delete-btn:hover { color: #eba0ac; background: #313244; }

.editor-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.tab-bar { display: flex; background: #11111b; border-bottom: 1px solid #313244; min-height: 35px; overflow-x: auto; }
.tab-bar::-webkit-scrollbar { height: 3px; }
.tab-bar::-webkit-scrollbar-thumb { background: #45475a; }
.tab { display: flex; align-items: center; gap: 4px; padding: 8px 14px; cursor: pointer; border-right: 1px solid #313244; font-size: 12px; white-space: nowrap; color: #a6adc8; min-width: 0; }
.tab:hover { background: #313244; color: #cdd6f4; }
.tab.active { background: #1e1e2e; color: #cdd6f4; border-bottom: 2px solid #cba6f7; }
.tab-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.tab-close { font-size: 14px; padding: 1px 4px; border-radius: 3px; color: #585b70; }
.tab-close:hover { background: #45475a; color: #f38ba8; }
.tab-dirty { color: #f9e2af; font-size: 14px; line-height: 1; }

.editor-header { padding: 10px 16px; border-bottom: 1px solid #313244; display: flex; gap: 12px; align-items: center; background: #181825; }
.editor-header input { background: #313244; border: 1px solid #45475a; color: #cdd6f4; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
.editor-header input:focus { outline: none; border-color: #cba6f7; }
#name-input { width: 170px; }
#label-input { flex: 1; max-width: 240px; }
#type-input { width: 120px; }
.actions { margin-left: auto; display: flex; gap: 8px; }
.actions button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
#save-btn { background: #a6e3a1; color: #1e1e2e; }
#save-btn:hover { background: #94e2d5; }
#run-btn { background: #89b4fa; color: #1e1e2e; }
#run-btn:hover { background: #74c7ec; }
#debug-btn { background: #f9e2af; color: #1e1e2e; }
#debug-btn:hover { background: #f5c2e7; }

#editor-wrap { flex: 1; overflow: hidden; }
#editor-wrap .CodeMirror { height: 100%; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; line-height: 1.6; }
#editor-wrap .CodeMirror-gutters { background: #181825; border-right: 1px solid #313244; }
#editor-wrap .CodeMirror-linenumber { color: #585b70; }
.output-area { height: 200px; min-height: 200px; border-top: 1px solid #313244; background: #11111b; display: flex; flex-direction: column; }
.output-area h3 { padding: 8px 16px; font-size: 12px; color: #a6adc8; border-bottom: 1px solid #313244; flex-shrink: 0; }
#output { flex: 1; padding: 12px 16px; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; overflow-y: auto; margin: 0; }
.error-text { color: #f38ba8; }
.CodeMirror-gutter-wrapper.bp-line .CodeMirror-linenumber { color: #f38ba8 !important; font-weight: bold; }
#editor-wrap .CodeMirror-gutters { cursor: pointer; }
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="sidebar-header">
    <h2>Scripts</h2>
    <button id="new-btn">+ New</button>
  </div>
   <ul id="script-list"></ul>
</aside>
<main class="editor-area">
  <div class="tab-bar" id="tab-bar"></div>
  <div class="editor-header">
    <input id="name-input" placeholder="name (unique id)" spellcheck="false" />
    <input id="label-input" placeholder="display name" spellcheck="false" />
    <input id="type-input" placeholder="type" spellcheck="false" />
    <div class="actions">
      <button id="debug-btn">Debug</button>
      <button id="save-btn">Save</button>
      <button id="run-btn">Run ▸</button>
    </div>
  </div>
  <div id="editor-wrap"></div>
  <div class="output-area">
    <h3>Output</h3>
    <pre id="output"></pre>
  </div>
</main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/closebrackets.min.js"></script>
<script>
const API = '/api/scripts';
let tabs = [];
let activeIdx = -1;

function tab(id) { return tabs.find(t => t.id === id); }
function activeTab() { return activeIdx >= 0 ? tabs[activeIdx] : null; }

const $ = id => document.getElementById(id);
const listEl = $('script-list');
const nameEl = $('name-input');
const labelEl = $('label-input');
const typeEl = $('type-input');
const outputEl = $('output');
const tabBar = $('tab-bar');

const editor = CodeMirror($('editor-wrap'), {
  mode: 'javascript',
  theme: 'material-darker',
  lineNumbers: true,
  autoCloseBrackets: true,
  gutters: ['CodeMirror-linenumbers'],
  tabSize: 2,
  indentUnit: 2,
  extraKeys: {
    'Ctrl-S': saveScript,
    'Cmd-S': saveScript,
    'Ctrl-Enter': runScript,
    'Cmd-Enter': runScript,
  }
});
editor.on('gutterClick', (cm, n) => {
  toggleBreakpoint(n + 1);
});
editor.on('changes', () => {
  const t = activeTab();
  if (t) { t.code = editor.getValue(); t.dirty = true; renderTabs(); }
});

function commitActiveTab() {
  const t = activeTab();
  if (!t) return;
  t.name = nameEl.value.trim();
  t.label = labelEl.value.trim();
  t.type = typeEl.value.trim();
  t.code = editor.getValue();
}

function switchTab(idx) {
  if (idx === activeIdx) return;
  commitActiveTab();
  activeIdx = idx;
  const t = tabs[idx];
  if (t) {
    nameEl.value = t.name || '';
    labelEl.value = t.label || '';
    typeEl.value = t.type || '';
    editor.setValue(t.code || '');
    outputEl.textContent = '';
    outputEl.className = '';
  }
  renderTabs();
  renderSidebar();
}

function openTab(script) {
  const existing = tabs.findIndex(t => t.id === script.id);
  if (existing >= 0) {
    switchTab(existing);
  } else {
    commitActiveTab();
    tabs.push({ id: script.id, name: script.name, label: script.label, type: script.type, code: script.tsCode, dirty: false });
    switchTab(tabs.length - 1);
  }
}

function closeTab(idx) {
  if (tabs[idx].dirty && !confirm('Discard unsaved changes?')) return;
  tabs.splice(idx, 1);
  if (tabs.length === 0) {
    activeIdx = -1;
    editor.setValue('');
    nameEl.value = ''; labelEl.value = ''; typeEl.value = '';
  } else if (idx <= activeIdx) {
    switchTab(Math.max(0, activeIdx - 1));
  }
  renderTabs();
}

function renderTabs() {
  tabBar.innerHTML = tabs.map((t, i) =>
    `<div class="tab${i === activeIdx ? ' active' : ''}" onclick="switchTab(${i})">
      ${t.dirty ? '<span class="tab-dirty">●</span>' : ''}
      <span class="tab-name">${esc(t.label || t.name || 'untitled')}</span>
      <span class="tab-close" onclick="event.stopPropagation();closeTab(${i})">×</span>
    </div>`
  ).join('');
}

function renderSidebar() {
  const a = activeTab();
  listEl.querySelectorAll('li').forEach(li => {
    li.classList.toggle('active', a && li.dataset.id === a.id);
  });
}

async function loadList() {
  const res = await fetch(API);
  const scripts = await res.json();
  listEl.innerHTML = '';
  for (const s of scripts) {
    const id = s.id;
    const li = document.createElement('li');
    li.dataset.id = id;
    li.innerHTML = `<div class="snippet-info"><div class="snippet-label-display">${esc(s.label)}</div><div class="snippet-name-display">${esc(s.name)}${s.type ? ' · ' + esc(s.type) : ''}</div></div>`;
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '\u00D7';
    delBtn.title = 'Delete';
    delBtn.onclick = (e) => { e.stopPropagation(); deleteScript(id); };
    li.appendChild(delBtn);
    li.onclick = () => openTab(s);
    listEl.appendChild(li);
  }
  renderSidebar();
}

async function saveScript(e) {
  if (e) e.preventDefault();
  commitActiveTab();
  const t = activeTab();
  if (!t) return;
  if (!t.name) { alert('Name is required'); return; }
  if (!t.label) { alert('Label is required'); return; }

  const payload = { name: t.name, label: t.label, type: t.type, tsCode: t.code };
  let res;
  if (t.id) {
    res = await fetch(`${API}/${t.id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  } else {
    res = await fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    alert('Save failed: ' + (data.error || res.statusText));
    return;
  }
  const script = await res.json();
  t.id = script.id;
  t.dirty = false;
  renderTabs();
  await loadList();
}

async function runScript(e) {
  if (e) e.preventDefault();
  await saveScript();
  const t = activeTab();
  if (!t || !t.id) return;
  outputEl.textContent = 'Running...';
  outputEl.className = '';
  const res = await fetch(`${API}/${t.id}/run`, { method: 'POST' });
  const result = await res.json();
  outputEl.textContent = result.error || result.output || '(no output)';
  if (result.error) outputEl.className = 'error-text';
}

async function deleteScript(id) {
  if (!confirm('Delete this script?')) return;
  await fetch(`${API}/${id}`, { method: 'DELETE' });
  const idx = tabs.findIndex(t => t.id === id);
  if (idx >= 0) tabs.splice(idx, 1);
  if (tabs.length === 0) { activeIdx = -1; editor.setValue(''); }
  else if (activeIdx >= tabs.length) switchTab(tabs.length - 1);
  renderTabs();
  await loadList();
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

$('new-btn').onclick = async () => {
  commitActiveTab();
  const untitled = { id: null, name: '', label: 'Untitled', type: '', code: '', dirty: false };
  tabs.push(untitled);
  switchTab(tabs.length - 1);
};
$('save-btn').onclick = saveScript;
$('run-btn').onclick = runScript;
$('debug-btn').onclick = debugScript;

async function toggleBreakpoint(line) {
  const t = activeTab();
  if (!t || !t.id) return;
  const info = editor.lineInfo(line - 1);
  const gutterClass = info.gutterClass || '';
  const hasBp = gutterClass.indexOf('bp-line') >= 0;
  if (hasBp) {
    fetch(`${API}/${t.id}/breakpoints/${line}`, { method: 'DELETE' });
    editor.removeLineClass(line - 1, 'gutter', 'bp-line');
  } else {
    fetch(`${API}/${t.id}/breakpoints`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ line, enabled: true }),
    });
    editor.addLineClass(line - 1, 'gutter', 'bp-line');
  }
}

function makeBpMarker() {
  const el = document.createElement('span');
  el.className = 'bp-marker';
  el.textContent = '●';
  return el;
}

async function debugScript(e) {
  if (e) e.preventDefault();
  await saveScript();
  const t = activeTab();
  if (!t || !t.id) return;
  outputEl.textContent = 'Debugging...';
  outputEl.className = '';
  const res = await fetch(`${API}/${t.id}/debug`, { method: 'POST' });
  const result = await res.json();
  let text = '';
  if (result.output) text += result.output;
  if (result.breakpoints && result.breakpoints.length > 0) {
    text += '\n=== Breakpoints ===';
    result.breakpoints.forEach(bp => {
      text += `\n  ● Line ${bp.line}`;
      if (bp.vars && Object.keys(bp.vars).length > 0) {
        text += '\n    Globals: ' + JSON.stringify(bp.vars);
      }
      if (bp.name) {
        text += '\n    Stack:\n      ' + bp.name.replace(/\\n/g, '\n      ');
      }
    });
  }
  if (result.error) outputEl.className = 'error-text';
  outputEl.textContent = text;
}

async function loadBreakpoints() {
  const t = activeTab();
  for (let i = 0; i < editor.lineCount(); i++) {
    editor.removeLineClass(i, 'gutter', 'bp-line');
  }
  if (!t || !t.id) return;
  const res = await fetch(`${API}/${t.id}/breakpoints`);
  const bps = await res.json();
  bps.forEach(bp => {
    editor.addLineClass(bp.line - 1, 'gutter', 'bp-line');
  });
}

const origSwitchTab = switchTab;
switchTab = function(idx) {
  origSwitchTab(idx);
  loadBreakpoints();
};

loadList();
</script>
</body>
</html>
