<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS QuickJS Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1e1e2e; color: #cdd6f4; height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; }
.sidebar { width: 260px; min-width: 260px; background: #181825; border-right: 1px solid #313244; display: flex; flex-direction: column; }
.sidebar-header { padding: 16px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
.sidebar-header h2 { font-size: 15px; font-weight: 600; }
#new-btn { background: #cba6f7; color: #1e1e2e; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
#new-btn:hover { background: #b4befe; }
#script-list { list-style: none; overflow-y: auto; flex: 1; }
#script-list li { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
#script-list li:hover { background: #313244; }
#script-list li.active { background: #45475a; border-left: 3px solid #cba6f7; }
.snippet-info { overflow: hidden; }
.snippet-label-display { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snippet-name-display { font-size: 11px; color: #a6adc8; margin-top: 2px; }
.delete-btn { background: none; border: none; color: #f38ba8; cursor: pointer; font-size: 18px; padding: 2px 6px; line-height: 1; border-radius: 4px; }
.delete-btn:hover { color: #eba0ac; background: #313244; }
.editor-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.editor-header { padding: 10px 16px; border-bottom: 1px solid #313244; display: flex; gap: 12px; align-items: center; background: #181825; }
.editor-header input { background: #313244; border: 1px solid #45475a; color: #cdd6f4; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
.editor-header input:focus { outline: none; border-color: #cba6f7; }
#name-input { width: 170px; }
#label-input { flex: 1; max-width: 240px; }
#type-input { width: 120px; }
.actions { margin-left: auto; display: flex; gap: 8px; }
.actions button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
#save-btn { background: #a6e3a1; color: #1e1e2e; }
#save-btn:hover { background: #94e2d5; }
#run-btn { background: #89b4fa; color: #1e1e2e; }
#run-btn:hover { background: #74c7ec; }

.editor-wrapper { flex: 1; display: flex; overflow: hidden; position: relative; }
.line-gutter { width: 48px; min-width: 48px; background: #181825; border-right: 1px solid #313244; overflow: hidden; user-select: none; text-align: right; padding: 16px 8px 16px 0; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; line-height: 1.6; color: #585b70; }
.editor-pane { flex: 1; position: relative; overflow: hidden; }
#code-highlight, #code-editor {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-size: 14px; line-height: 1.6; tab-size: 2;
  padding: 16px; margin: 0; border: none; outline: none;
  white-space: pre; overflow: auto; word-wrap: normal;
}
#code-highlight { background: #1e1e2e; color: #cdd6f4; z-index: 1; }
#code-editor { background: transparent; color: transparent; caret-color: #cba6f7; z-index: 2; resize: none; }
#code-editor::placeholder { color: #585b70; }
.output-area { height: 200px; min-height: 200px; border-top: 1px solid #313244; background: #11111b; display: flex; flex-direction: column; }
.output-area h3 { padding: 8px 16px; font-size: 12px; color: #a6adc8; border-bottom: 1px solid #313244; flex-shrink: 0; }
#output { flex: 1; padding: 12px 16px; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; overflow-y: auto; margin: 0; }
.error-text { color: #f38ba8; }

.hl-comment { color: #6c7086; font-style: italic; }
.hl-keyword { color: #cba6f7; }
.hl-string  { color: #a6e3a1; }
.hl-number  { color: #fab387; }
.hl-type    { color: #89b4fa; }
.hl-func    { color: #89dceb; }
.hl-regex   { color: #f38ba8; }
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="sidebar-header">
    <h2>Scripts</h2>
    <button id="new-btn">+ New</button>
  </div>
   <ul id="script-list"></ul>
</aside>
<main class="editor-area">
  <div class="editor-header">
    <input id="name-input" placeholder="name (unique id)" spellcheck="false" />
    <input id="label-input" placeholder="display name" spellcheck="false" />
    <input id="type-input" placeholder="type" spellcheck="false" />
    <div class="actions">
      <button id="save-btn">Save</button>
      <button id="run-btn">Run ▸</button>
    </div>
  </div>
  <div class="editor-wrapper">
    <div class="line-gutter" id="line-gutter"></div>
    <div class="editor-pane">
      <pre id="code-highlight"><code></code></pre>
      <textarea id="code-editor" placeholder="// TypeScript code here...
const msg: string = 'Hello, QuickJS!';
console.log(msg);" spellcheck="false"></textarea>
    </div>
  </div>
  <div class="output-area">
    <h3>Output</h3>
    <pre id="output"></pre>
  </div>
</main>
</div>
<script>
const API = '/api/scripts';
let currentId = null;

const $ = id => document.getElementById(id);
const listEl = $('script-list');
const nameEl = $('name-input');
const labelEl = $('label-input');
const typeEl = $('type-input');
const codeEditor = $('code-editor');
const codeHigh = $('code-highlight').firstElementChild;
const lineGutter = $('line-gutter');
const outputEl = $('output');

const KW = /\b(?:const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|typeof|instanceof|void|delete|throw|try|catch|finally|class|extends|import|export|from|as|async|await|yield|of|in|this|super|true|false|null|undefined|enum|interface|type|implements|namespace|module|declare|abstract|static|public|private|protected|readonly)\b/g;
const TY = /\b(?:string|number|boolean|void|any|never|unknown|object|bigint|symbol|undefined|null)\b/g;

function highlight(ts) {
  let html = esc(ts);
  html = html.replace(/(\/\/[^\n]*)/g, '<span class="hl-comment">$1</span>');
  html = html.replace(/('(?:[^'\\]|\\.)*')/g, '<span class="hl-string">$1</span>');
  html = html.replace(/("(?:[^"\\]|\\.)*")/g, '<span class="hl-string">$1</span>');
  html = html.replace(/(`(?:[^`\\]|\\.)*`)/g, '<span class="hl-string">$1</span>');
  html = html.replace(/(\b\d+\.?\d*\b)/g, '<span class="hl-number">$1</span>');
  html = html.replace(KW, '<span class="hl-keyword">$1</span>');
  html = html.replace(TY, '<span class="hl-type">$1</span>');
  html = html.replace(/(\w+)(?=\s*\()/g, '<span class="hl-func">$1</span>');
  html = html.replace(/\/([^*\/][^\n]*?\/)/g, '<span class="hl-regex">$1</span>');
  return html;
}

function updateHighlight() {
  const text = codeEditor.value;
  const lines = text.split('\n');
  const nums = lines.map((_, i) => i + 1).join('\n');
  if (lineGutter.textContent !== nums) {
    lineGutter.textContent = nums;
  }
  codeHigh.innerHTML = highlight(text) + '\n';
}

function syncHeight() {
  updateHighlight();
}
codeEditor.addEventListener('input', syncHeight);
codeEditor.addEventListener('scroll', () => {
  codeHigh.parentElement.scrollTop = codeEditor.scrollTop;
  codeHigh.parentElement.scrollLeft = codeEditor.scrollLeft;
  lineGutter.scrollTop = codeEditor.scrollTop;
});

async function loadList() {
  const res = await fetch(API);
  const scripts = await res.json();
  listEl.innerHTML = '';
  for (const s of scripts) {
    const id = s.id;
    const li = document.createElement('li');
    li.innerHTML = `<div class="snippet-info"><div class="snippet-label-display">${esc(s.label)}</div><div class="snippet-name-display">${esc(s.name)}${s.type ? ' · ' + esc(s.type) : ''}</div></div>`;
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '\u00D7';
    delBtn.title = 'Delete';
    delBtn.onclick = (e) => { e.stopPropagation(); deleteScript(id); };
    li.appendChild(delBtn);
    li.onclick = () => selectScript(id);
    if (id === currentId) li.classList.add('active');
    listEl.appendChild(li);
  }
}

async function selectScript(id) {
  currentId = id;
  const res = await fetch(`${API}/${id}`);
  if (!res.ok) return;
  const s = await res.json();
  nameEl.value = s.name;
  labelEl.value = s.label;
  typeEl.value = s.type || '';
  codeEditor.value = s.tsCode;
  updateHighlight();
  outputEl.textContent = '';
  outputEl.className = '';
  loadList();
}

async function saveScript() {
  const payload = {
    name: nameEl.value.trim(),
    label: labelEl.value.trim(),
    type: typeEl.value.trim(),
    tsCode: codeEditor.value,
  };
  if (!payload.name) { alert('Name is required'); return; }
  if (!payload.label) { alert('Label is required'); return; }
  let res;
  if (currentId) {
    res = await fetch(`${API}/${currentId}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  } else {
    res = await fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    alert('Save failed: ' + (data.error || res.statusText));
    return;
  }
  const script = await res.json();
  currentId = script.id;
  await loadList();
}

async function runScript() {
  if (!currentId) {
    await saveScript();
    if (!currentId) return;
  }
  outputEl.textContent = 'Running...';
  outputEl.className = '';
  const res = await fetch(`${API}/${currentId}/run`, { method: 'POST' });
  const result = await res.json();
  outputEl.textContent = result.error || result.output || '(no output)';
  if (result.error) outputEl.className = 'error-text';
}

async function deleteScript(id) {
  if (!confirm('Delete this script?')) return;
  await fetch(`${API}/${id}`, { method: 'DELETE' });
  if (currentId === id) newScript();
  await loadList();
}

function newScript() {
  currentId = null;
  nameEl.value = '';
  labelEl.value = '';
  typeEl.value = '';
  codeEditor.value = '';
  updateHighlight();
  outputEl.textContent = '';
  outputEl.className = '';
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

$('new-btn').onclick = () => { newScript(); loadList(); };
$('save-btn').onclick = saveScript;
$('run-btn').onclick = runScript;

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveScript(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runScript(); }
});

updateHighlight();
loadList();
</script>
</body>
</html>
